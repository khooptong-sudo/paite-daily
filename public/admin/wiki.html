<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Paite Wiki · Admin</title>
<script src="/theme.js"></script>
<link rel="stylesheet" href="/admin/admin.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Instrument+Serif:ital@1&family=Inter:wght@400;600;700&display=swap">
<style>
:root{--ink:#12100e;--paper:#f4f2ed;--card:#fffdf8;--line:#ddd7c9;--muted:#6b665c;--crimson:#b3253c;--sage:#4f6b4a;--head:"Young Serif",Georgia,serif;--body:"Inter",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;padding:26px 16px 90px;background:var(--paper);color:var(--ink);font:16px/1.55 var(--body)}
main{max-width:42rem;margin:0 auto}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:4px}
h1{font:400 1.6rem/1.2 var(--head);margin:0}
h2{font:400 1.2rem/1.3 var(--head);margin:0 0 12px}
.who{color:var(--muted);font-size:.85rem}
.back{color:var(--muted);font-size:.86rem;text-decoration:none;border-bottom:1px solid var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;margin:0 0 26px;box-shadow:0 10px 30px rgba(0,0,0,.05)}
.eyebrow{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.block{background:#f7f5ef;border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 12px}
.meta{color:var(--muted);font-size:.78rem;margin:0 0 10px}
.help{color:var(--muted);font-size:.83rem;margin:4px 0 0}
#status{min-height:1.4em;color:var(--crimson);font-size:.9rem;margin:.6rem 0 1rem}
.msg{color:var(--crimson);font-size:.85rem;margin:6px 0}
.msg.ok{color:var(--sage)}
.empty{color:var(--muted)}
button{font:inherit;font-size:.9rem;padding:9px 16px;border-radius:12px;border:1px solid #cfc8b8;background:#fff;color:var(--ink);cursor:pointer}
button:hover{background:#f0ede4}
button:disabled{opacity:.45;cursor:default}
button.go{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:600}
button.danger{color:var(--crimson)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
select,input,textarea{font:inherit;font-size:1rem;padding:9px 11px;border:1px solid #cfc8b8;border-radius:12px;background:#fff;color:var(--ink);max-width:100%}
input,textarea{width:100%}
textarea{min-height:120px;resize:vertical}
label{display:block;font-size:.8rem;color:var(--muted);margin:12px 0 4px}
.item{border-top:1px solid var(--line);padding:12px 0}
.item:first-of-type{border-top:0}
.item .title{font-weight:600;cursor:pointer;margin:0 0 2px;background:none;border:0;padding:0;text-align:left;font-size:1rem}
.tag{display:inline-block;font-size:.72rem;border:1px solid var(--line);border-radius:99px;padding:1px 9px;margin:0 6px 4px 0;color:var(--muted)}
.pre{white-space:pre-wrap;margin:6px 0 0}
blockquote{margin:8px 0;padding:2px 0 2px 12px;border-left:3px solid var(--crimson)}
.vote{font-size:.85rem;margin:2px 0}
.no{color:var(--crimson);font-weight:600}
.yes{color:var(--sage);font-weight:600}
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>Paite Wiki</h1>
    <a class="back" href="/admin/">&larr; Back to admin</a>
  </div>
  <p id="status" role="status" aria-live="polite"></p>
  <section class="card" id="sec-sources"><h2>Sources</h2></section>
  <section class="card" id="sec-add"><h2>Add a source</h2></section>
  <section class="card" id="sec-flagged"><h2>Answers marked wrong</h2></section>
  <section class="card" id="sec-open"><h2>Questions with no answer</h2></section>
  <section class="card" id="sec-site"><h2>Site data</h2></section>
</main>
<script src="/review/wiki.js" data-api="/admin/api/wiki" data-login="/admin/login" data-admin="1"></script>
</body>
</html>
