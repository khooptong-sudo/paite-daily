<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paite Review</title>
<meta name="theme-color" content="#000000">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<link rel="stylesheet" href="/style.css">
<style>
  .answer { display: grid; gap: 8px; border: 1px solid var(--line); border-radius: 14px; padding: 12px; background: rgba(255,255,255,.04); }
  .answer p { margin: 0; font-size: 1.2rem; }
  .meta { color: var(--muted); font-size: .85rem; }
  .ai { background: rgba(255,255,255,.08); border-radius: 10px; padding: 8px 10px; font-size: .9rem; }
  .answer label { display: flex; align-items: center; justify-content: flex-start; gap: 8px; font-weight: 400; }
  .answer input[type=checkbox] { width: auto; margin: 0; }
  .answer.variant { border: 2px dashed #fff; padding: 11px; }
  .queue { color: var(--muted); font-size: .95rem; margin: 0; }
  .kbd { display: none; margin-left: 8px; padding: 0 6px; border: 1px solid var(--line); border-radius: 6px; font-size: .75rem; opacity: .8; }
  @media (min-width: 700px) { .kbd { display: inline-block; } }
  #help[hidden] { display: none; }
  .row3 { display: flex; gap: 8px; flex-wrap: wrap; }
</style>
</head>
<body>
<main>
  <header><h1>Paite Review</h1><div class="streak" id="who"></div></header>
  <p class="queue" id="queue" aria-live="polite"></p>
  <section class="card" id="card">
    <div class="label">English</div>
    <p class="sentence" id="english" tabindex="-1">Loading…</p>
    <div id="answers" style="display:grid;gap:10px"></div>
    <label>Register of the accepted answer
      <select id="register"><option value="">As given</option><option value="spoken">Spoken</option><option value="written">Written</option><option value="both">Both</option></select>
    </label>
    <label>Note (optional)<input id="note" maxlength="300"></label>
    <div class="row3">
      <button type="button" id="reject" aria-keyshortcuts="R">✕ Reject all<span class="kbd" aria-hidden="true">R</span></button>
      <button type="button" id="retire">Retire sentence</button>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p><button type="button" id="undo" hidden aria-keyshortcuts="U">Undo<span class="kbd" aria-hidden="true">U</span></button>
    <p class="meta" id="help" hidden>Shortcuts: A accept the focused answer (or the first), R reject all, U undo, ? show or hide this help.</p>
  </section>
</main>
<script src="/review/review.js"></script>
</body>
</html>
