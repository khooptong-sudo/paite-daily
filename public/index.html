  <header>
    <h1>Paite Daily</h1>
    <div><span class="streak" id="today"></span> <span class="badge" id="badge" hidden></span></div>
    <a class="back" href="/review">Reviewer <span aria-hidden="true">&rarr;</span></a>
  </header>
  <div class="goal" id="goal" hidden><div><b id="goal-n"></b> / <span id="goal-max"></span> <span data-s="goalLine"></span></div><div class="goal-bar" id="goal-bar" role="progressbar" aria-valuemin="0"><i></i></div></div>
  <section class="card" id="feedback" aria-labelledby="fb-title" hidden>
    <h2 id="fb-title" data-s="feedbackTitle"></h2>
    <ul id="fb-list"></ul>
    <button type="button" class="primary" id="fb-ok" data-s="gotIt"></button>
  </section>
  <section class="card">
    <div class="label" id="label" data-s="translate"></div>
    <p class="sentence" id="sentence" aria-live="polite"></p>
    <button type="button" id="retry" data-s="tryAgain" hidden></button>
    <form id="form" novalidate>
      <textarea id="paite" required autocomplete="off" autocapitalize="sentences" maxlength="300" aria-label="Paite"></textarea>
      <label for="explanation" data-s="explanationLabel"></label>
      <textarea id="explanation" autocomplete="off" maxlength="500" rows="2"></textarea>
      <fieldset class="register">
        <legend data-s="register"></legend>
        <label><input type="radio" name="register" value="both" checked> <span data-s="both"></span></label>
        <label><input type="radio" name="register" value="spoken"> <span data-s="spoken"></span></label>
        <label><input type="radio" name="register" value="written"> <span data-s="written"></span></label>
      </fieldset>
      <div class="actions">
        <button type="submit" class="primary" id="send" data-s="send"></button>
        <button type="button" id="skip" data-s="skip"></button>
      </div>
      <p class="licence" data-s="licence"></p>
      <p class="status" id="status" role="status"></p>
    </form>
    <div id="ask-name" hidden>
      <p id="askName" data-s="askName"></p>
      <input id="name" aria-labelledby="askName" maxlength="60" autocomplete="nickname">
      <div class="actions">
        <button type="button" class="primary" id="save-name" data-s="send"></button>
        <button type="button" id="no-name" data-s="noThanks"></button>
      </div>
    </div>
  </section>
  <button type="button" class="primary" id="share" data-s="share" hidden></button>
  <section class="card" aria-labelledby="word-h">
    <h2 id="word-h" data-s="addWord"></h2>
    <p class="licence" data-s="addWordNote"></p>
    <form id="word-form" novalidate>
      <label for="w-paite">Paite</label>
      <input id="w-paite" required maxlength="60" autocomplete="off">
      <label for="w-english">English</label>
      <input id="w-english" required maxlength="120" autocomplete="off">
      <label for="w-note" data-s="wordNote"></label>
      <input id="w-note" maxlength="200" autocomplete="off">
      <div class="actions"><button type="submit" class="primary" id="w-send" data-s="send"></button></div>
      <p class="status" id="w-status" role="status"></p>
    </form>
  </section>
